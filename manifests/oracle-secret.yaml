# Template only: never commit real keys. Copy to a sealed secret manager.
# FELICA_KEYS_JSON is key material plus its node path (server/src/config.rs):
# {"k_group":"<8B hex>","k_user":"<8B hex>",
#  "system_code":3,"areas":[64],"services":[72]}
# System/area/service codes select the authenticated key node.
# Operational knobs (bind address, key path) live in `oracle-config`.
apiVersion: v1
kind: Secret
metadata:
  name: oracle-secret
  namespace: felica-oracle
  labels:
    app: felica-oracle
    environment: production
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-options: Prune=false
type: Opaque
stringData:
  keys.json: '{"k_group":"REPLACE_ME","k_user":"REPLACE_ME","system_code":3,"areas":[64],"services":[72]}'
