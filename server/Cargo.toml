[package]
name = "felica-oracle"
version = "0.1.0"
edition = "2021"

[dependencies]
jsonrpsee = { version = "0.26", features = ["server", "macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
felica = { version = "1.0.3", default-features = false }
felica-prover = { path = "../prover" }
des = "0.9"
hex = "0.4"
thiserror = "2"
zeroize = "1"
subtle = "2"
cbc = "0.2"
